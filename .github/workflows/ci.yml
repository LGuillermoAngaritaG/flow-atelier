name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --dev
      - name: Lint (ruff)
        run: uv run ruff check .

  test:
    # Windows earns its slot here rather than only at release: the path handling
    # (os.sep guards, flow-id joins) and the npx/uvx argv building are where this
    # codebase actually breaks per-OS, and finding that at release time means it
    # blocks the release. macOS is close enough to Linux to leave to release.yml.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --dev
      - name: Tests (live harness excluded via marker)
        run: uv run pytest
