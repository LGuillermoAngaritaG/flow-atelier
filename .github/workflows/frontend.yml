name: Frontend

# Builds the React/Vite UI under frontend/ and syncs its build output into
# flow_atelier/dist/ — the bundled SPA that ships in the wheel and is served by
# the FastAPI app (see flow_atelier/services/api/app.py, _STATIC_DIR).
#
# Runs on pull requests (and manually via workflow_dispatch) so we know the UI
# builds before merge. For PRs from this repo the rebuilt bundle is committed
# back to the PR branch and lands on main when the PR is merged — there is no
# separate build/commit on main (which is protected and requires PRs). The
# commit uses GITHUB_TOKEN and is tagged [skip ci]; pushes made by GITHUB_TOKEN
# do not re-trigger workflows, so there is no build loop. PRs from forks can't be
# pushed to by this token, so they build as a check only.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  # Do not cancel a run that may be mid-commit/push to the PR branch.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # On PRs, check out the PR's head branch (not the merge ref) so the
          # bundled-UI commit below can be pushed back to that branch.
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        # Left unset, VITE_USE_MOCK_API defaults off (real backend) and
        # VITE_BACKEND_URL resolves to the serving origin at runtime, so the
        # bundle targets whatever host:port `atelier serve` runs on. Set either
        # via repo variables/secrets only to override that default.
        run: npm run build

      - name: Sync build output to flow_atelier/dist
        working-directory: .
        run: |
          rm -rf flow_atelier/dist
          cp -r frontend/dist flow_atelier/dist

      - name: Commit bundled UI to the PR branch
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow_atelier/dist
          if git diff --cached --quiet; then
            echo "No UI changes — nothing to commit."
          else
            git commit -m "chore(ui): rebuild bundled frontend [skip ci]"
            git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          fi
