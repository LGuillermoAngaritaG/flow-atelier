repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: pytest
        name: pytest (excluding live harness)
        entry: uv run pytest --ignore=tests/test_live_harness.py
        language: system
        pass_filenames: false
        stages: [pre-push]
